name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT (NETBIRD) ===" -ForegroundColor Green
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory

    - name: Enable RDP
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Set-Service -Name TermService -StartupType Automatic
        Start-Service -Name TermService
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        Write-Host "RDP setup complete" -ForegroundColor Green

    - name: Create User Account
      run: |
        Write-Host "Setting up user account..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

    - name: Install NetBird
      run: |
        Write-Host "Installing NetBird..." -ForegroundColor Green
        Invoke-WebRequest -Uri "https://pkgs.netbird.io/windows/x64" -OutFile "netbird-installer.exe"
        Start-Process -FilePath ".\netbird-installer.exe" -ArgumentList "/S" -Wait
        Write-Host "NetBird installed" -ForegroundColor Green

    - name: Connect to NetBird
      run: |
        Write-Host "Connecting to NetBird..." -ForegroundColor Green
        & "C:\Program Files\NetBird\netbird.exe" up --setup-key ${{ secrets.NETBIRD_SETUP_KEY }}
        Start-Sleep -Seconds 10
        & "C:\Program Files\NetBird\netbird.exe" status

    - name: Get NetBird IP
      run: |
        Write-Host "=== NETBIRD CONNECTION DETAILS ===" -ForegroundColor Green
        $ip = & "C:\Program Files\NetBird\netbird.exe" status --json | ConvertFrom-Json
        Write-Host "NetBird IP: $($ip.netbirdIp)" -ForegroundColor Yellow
        Write-Host "Username: runneradmin" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow
        Write-Host "`nOpen NetBird dashboard and click RDP on this machine." -ForegroundColor Cyan

    - name: Install Essential Software
      run: |
        Write-Host "Installing essential software..." -ForegroundColor Green
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        choco install 7zip -y
        choco install notepadplusplus -y
        choco install googlechrome -y --ignore-checksums

    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "RDP instance is running via NetBird." -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow

        $counter = 0
        while ($true) {
          $counter++
          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
          Start-Sleep -Seconds 60
        }
